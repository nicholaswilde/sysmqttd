# Based on ripgrep's release action:
# https://github.com/BurntSushi/ripgrep/blob/master/.github/workflows/release.yml

name: release
on:
  workflow_dispatch:
    inputs:
      fake_version:
        description: 'Fake version for testing (e.g. 0.1.0)'
        required: false
        default: '0.0.0-test'
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  create-release:
    name: create-release
    needs: [ci]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Get the release version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.fake_version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi
      - name: Show the version
        run: |
          echo "version is: ${{ steps.get_version.outputs.version }}"
      - name: Check that tag version matches Cargo.toml version
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            cargo_version=$(grep "^version =" Cargo.toml | head -n1 | cut -d'"' -f2)
            tag_version="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag_version" != "$cargo_version" ]]; then
              echo "Tag version ($tag_version) does not match Cargo.toml version ($cargo_version)"
              exit 1
            fi
          fi
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} --draft --prerelease --verify-tag --title ${{ steps.get_version.outputs.version }}

  build-release:
    name: build-release
    needs: ['create-release']
    runs-on: ${{ matrix.os }}

    env:
      # For some builds, we use cross to test on 32-bit and big-endian
      # systems.
      CARGO: cargo
      # When CARGO is set to 'cross', this is set to '--target'.
      TARGET_FLAGS: ""
      # When CARGO is set to 'cross', TARGET_DIR includes matrix.target.
      TARGET_DIR: ./target
      # Bump this as appropriate. We pin to a version to make sure CI
      # continues to work as cross releases in the past have broken things
      # in subtle ways.
      CROSS_VERSION: v0.2.5
      # Emit backtraces on panics.
      RUST_BACKTRACE: 1
    strategy:
      fail-fast: false
      matrix:
        build: [linux, linux-arm, linux-armv7, linux-armv6]
        include:
        - build: linux
          os: ubuntu-latest
          rust: stable
          target: x86_64-unknown-linux-musl
          strip: x86_64-linux-musl-strip
        - build: linux-arm
          os: ubuntu-latest
          rust: stable
          target: aarch64-unknown-linux-musl
          strip: aarch64-linux-musl-strip
          qemu: qemu-aarch64
        - build: linux-armv7
          os: ubuntu-latest
          rust: stable
          target: armv7-unknown-linux-musleabihf
          strip: arm-linux-musleabihf-strip
          qemu: qemu-arm
        - build: linux-armv6
          os: ubuntu-latest
          rust: stable
          target: arm-unknown-linux-gnueabihf
          strip: arm-linux-gnueabihf-strip
          qemu: qemu-arm

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        targets: ${{ matrix.target }}

    - name: Rust Cache
      uses: swatinem/rust-cache@v2

    - name: Use Cross
      if: matrix.os == 'ubuntu-latest' && matrix.target != ''
      shell: bash
      run: |
        # In the past, new releases of 'cross' have broken CI. So for now, we
        # pin it. We also use their pre-compiled binary releases because cross
        # has over 100 dependencies and takes a bit to compile.
        dir="$RUNNER_TEMP/cross-download"
        mkdir "$dir"
        echo "$dir" >> $GITHUB_PATH
        cd "$dir"
        curl -LO "https://github.com/cross-rs/cross/releases/download/$CROSS_VERSION/cross-x86_64-unknown-linux-musl.tar.gz"
        tar xf cross-x86_64-unknown-linux-musl.tar.gz
        echo "CARGO=cross" >> $GITHUB_ENV
        
        # Force using more recent images to avoid glibc issues with newer crates
        cd "$GITHUB_WORKSPACE"
        echo "[target.${{ matrix.target }}]" > Cross.toml
        echo "image = \"ghcr.io/cross-rs/${{ matrix.target }}:main\"" >> Cross.toml

    - name: Set target variables
      shell: bash
      run: |
        echo "TARGET_FLAGS=--target ${{ matrix.target }}" >> $GITHUB_ENV
        echo "TARGET_DIR=./target/${{ matrix.target }}" >> $GITHUB_ENV
        if [[ "${{ matrix.os }}" == windows-* ]]; then
          bin="target/${{ matrix.target }}/release/sysmqttd.exe"
        else
          bin="target/${{ matrix.target }}/release/sysmqttd"
        fi
        echo "BIN=$bin" >> $GITHUB_ENV
        
    - name: Show command used for Cargo
      run: |
        echo "cargo command is: ${{ env.CARGO }}"
        echo "target flag is: ${{ env.TARGET_FLAGS }}"
        echo "target dir is: ${{ env.TARGET_DIR }}"
        echo "bin is: ${{ env.BIN }}"

    - name: Setup Custom Cross Image
      if: matrix.build == 'linux-armv6'
      run: |
        # Create the Dockerfile on the fly
        echo "FROM ghcr.io/cross-rs/arm-unknown-linux-gnueabihf:main" > Dockerfile.custom
        echo "USER root" >> Dockerfile.custom
        echo "RUN apt-get update && apt-get install -y binutils-arm-linux-gnueabihf" >> Dockerfile.custom
        
        # Create Cross.toml on the fly
        echo "[target.arm-unknown-linux-gnueabihf]" > Cross.toml
        echo "dockerfile = \"./Dockerfile.custom\"" >> Cross.toml
        
    - name: Build release binary
      shell: bash
      run: |
        ${{ env.CARGO }} build --release --verbose ${{ env.TARGET_FLAGS }}

    - name: Strip release binary (macos)
      if: matrix.build == 'macos' || matrix.build == 'macos-arm'
      run: strip "${{ env.BIN }}"

    - name: Strip release binary (cross)
      if: matrix.build == 'linux' || matrix.build == 'linux-arm' || matrix.build == 'linux-armv7'
      shell: bash
      run: |
        docker run --rm -v \
          "$PWD/target:/target:Z" \
          "ghcr.io/cross-rs/${{ matrix.target }}:main" \
          "${{ matrix.strip }}" \
          "/$BIN"

    - name: Strip release binary (cross)
      if: matrix.build == 'linux-armv6'
      shell: bash
      run: |
        docker run --rm -v \
          "$PWD/target:/target:Z" \
          --entrypoint /bin/sh \
          "ghcr.io/cross-rs/${{ matrix.target }}:main" \
          -c "apt-get update && apt-get install -y binutils-arm-linux-gnueabihf && ${{ matrix.strip }} /$BIN"

    - name: Install Packaging Utilities
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y rpm
        curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
        cargo binstall --no-confirm cargo-deb cargo-generate-rpm

    - name: Build archive
      shell: bash
      run: |
        outdir="${{ env.TARGET_DIR }}/release"
        staging="sysmqttd-${{ needs.create-release.outputs.version }}-${{ matrix.target }}"
        echo "staging is: $staging"
        mkdir -p "$staging"
        
        # Copy binary
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          cp "$outdir/sysmqttd.exe" "$staging/"
        else
          cp "$outdir/sysmqttd" "$staging/"
        fi

        # Copy other files
        cp {README.md,LICENSE,sysmqttd.toml.example} "$staging/"
        mkdir -p "$staging/deployment"
        cp deployment/{sysmqttd.service.template,sysmqttd.sudoers.template} "$staging/deployment/"
        
        # Compress
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          7z a "$staging.zip" "$staging"
          certutil -hashfile "$staging.zip" SHA256 > "$staging.zip.sha256"
          echo "ASSET=$staging.zip" >> $GITHUB_ENV
          echo "ASSET_SUM=$staging.zip.sha256" >> $GITHUB_ENV
        else
          tar czf "$staging.tar.gz" "$staging"
          shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"
          echo "ASSET=$staging.tar.gz" >> $GITHUB_ENV
          echo "ASSET_SUM=$staging.tar.gz.sha256" >> $GITHUB_ENV
        fi

        # Build Debian & RPM packages if on Linux host
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          version="${{ needs.create-release.outputs.version }}"
          pkg_version="$version"
          if [ "${{ matrix.build }}" = "linux-armv6" ]; then
            pkg_version="${version}+armv6"
          fi

          # Build DEB using cargo-deb
          if [ "${{ matrix.build }}" = "linux-armv6" ]; then
            cargo deb --no-build --target "${{ matrix.target }}" --deb-version "$pkg_version"
          else
            cargo deb --no-build --target "${{ matrix.target }}"
          fi
          deb_generated=$(find target/ -name "*.deb" | head -n 1)
          deb_file="sysmqttd-${pkg_version}-${{ matrix.target }}.deb"
          cp "$deb_generated" "$deb_file"
          shasum -a 256 "$deb_file" > "$deb_file.sha256"

          # Build RPM using cargo-generate-rpm
          if [ "${{ matrix.build }}" = "linux-armv6" ]; then
            cargo generate-rpm --target "${{ matrix.target }}" --auto-req disabled --set-metadata "version = \"$pkg_version\""
          else
            cargo generate-rpm --target "${{ matrix.target }}" --auto-req disabled
          fi
          rpm_generated=$(find target/ -name "*.rpm" | head -n 1)
          rpm_file="sysmqttd-${pkg_version}-${{ matrix.target }}.rpm"
          cp "$rpm_generated" "$rpm_file"
          shasum -a 256 "$rpm_file" > "$rpm_file.sha256"
        fi

    - name: Upload release archive
      if: github.ref_type == 'tag'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        files_to_upload=()
        files_to_upload+=("${{ env.ASSET }}")
        files_to_upload+=("${{ env.ASSET_SUM }}")
        for f in *.deb *.deb.sha256 *.rpm *.rpm.sha256; do
          if [ -f "$f" ]; then
            files_to_upload+=("$f")
          fi
        done
        gh release upload ${{ github.ref_name }} "${files_to_upload[@]}" --clobber


  

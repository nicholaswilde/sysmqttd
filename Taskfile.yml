version: '3'

dotenv: ['.env']

vars:
  LOCAL_IP:
    sh: hostname -I | awk '{print $1}'
  ROOT_DIR:
    sh: git rev-parse --show-toplevel

tasks:
  update:
    desc: Update all cargo dependencies
    cmds:
      - cargo update

  clippy:
    desc: Run cargo clippy
    cmds:
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  check:
    desc: Check code for errors without generating binary
    cmds:
      - cargo check

  default:
    desc: List all available tasks
    cmds:
      - task --list

  fmt:
    desc: Format code with rustfmt
    cmds:
      - cargo fmt --all --check

  fmt:check:
    desc: Check code formatting with rustfmt
    cmds:
      - cargo fmt -- --check

  lint:
    desc: Run clippy lints on all targets
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  test:
    desc: Run unit and integration tests
    cmds:
      - RUN_DOCKER_TESTS=1 cargo test -- --test-threads=1

  test:integration:
    desc: Run integration tests
    cmds:
      - RUN_DOCKER_TESTS=1 cargo test --test integration_test -- --test-threads=1

  coverage:
    desc: Run tests and audit code coverage, enforcing a 90% line gate
    cmds:
      - RUN_DOCKER_TESTS=1 cargo llvm-cov --ignore-filename-regex "src/main.rs" --all-features --fail-under-lines 90 -- --test-threads=1

  coverage:report:
    desc: Generate coverage reports (lcov and html)
    cmds:
      - RUN_DOCKER_TESTS=1 cargo llvm-cov --ignore-filename-regex "src/main.rs" --all-features --lcov --output-path lcov.info -- --test-threads=1
      - RUN_DOCKER_TESTS=1 cargo llvm-cov --ignore-filename-regex "src/main.rs" --all-features --html -- --test-threads=1

  coverage:upload:
    desc: Upload coverage report to Coveralls
    preconditions:
      - sh: test -f lcov.info
        msg: "lcov.info doesn't exist"
    cmds:
      - coveralls report lcov.info  -n -r {{ .COVERALLS_REPO_TOKEN }}
    silent: true

  encrypt:
    desc: Encrypt files using SOPS
    preconditions:
      - sh: test -f .env
        msg: ".env file doesn't exist"
    cmds:
      - sops -e --input-type dotenv --output-type dotenv .env > .env.enc

  decrypt:
    desc: Decrypt files using SOPS
    preconditions:
      - sh: test -f .env.enc
        msg: ".env.enc doesn't exist"
    cmds:
      - sops -d --input-type dotenv --output-type dotenv .env.enc > .env

  deps:
    desc: Install dependencies
    cmds:
      - cargo install cross --git https://github.com/cross-rs/cross

  build:all:
    desc: Cross-compile optimized release binaries for ARMv6, ARMv7, ARM64, and AMD64
    cmds:
      - task: build:armv6
      - task: build:armv7
      - task: build:arm64
      - task: build:amd64

  build:armv6:
    desc: Compile ARMv6 binary (Raspberry Pi Zero W)
    cmds:
      - cross build --target arm-unknown-linux-gnueabihf --release

  build:armv7:
    desc: Compile ARMv7 binary (Raspberry Pi 2/3)
    cmds:
      - cross build --target armv7-unknown-linux-gnueabihf --release

  build:arm64:
    desc: Compile ARM64 binary (Raspberry Pi 3/4/5)
    cmds:
      - cross build --target aarch64-unknown-linux-gnu --release

  build:amd64:
    desc: Compile AMD64 binary (Standard PC/server)
    cmds:
      - cross build --target x86_64-unknown-linux-gnu --release

  markdownlint:
    desc: Lint markdown files with rumdl
    cmds:
      - rumdl check .

  markdownlint:fix:
    desc: Auto-fix markdown files with rumdl
    cmds:
      - rumdl check --fix .

  yamllint:
    desc: Lint YAML files with yamllint-rs
    cmds:
      - yamllint-rs .

  spellcheck:
    desc: Run typos spellchecker
    cmds:
      - typos

  spellcheck-file:
    desc: Run typos spellchecker on a specific file
    vars:
      FILE: '{{.FILE}}'
    cmds:
      - typos {{shellQuote .FILE}}

  shellcheck:
    desc: Lint shell scripts with shuck
    cmds:
      - shuck deployment/*.sh

  linkcheck:
    desc: Check links with lychee
    cmds:
      - lychee --config lychee.toml .

  linkcheck:offline:
    desc: Check links with lychee (offline)
    cmds:
      - lychee --offline --config lychee.toml .

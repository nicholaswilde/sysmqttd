[package]
name = "sysmqttd"
version = "0.1.0"
edition = "2021"

[dependencies]
sysinfo = { version = "0.30", default-features = false }
rumqttc = { version = "0.24", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", default-features = false, features = ["rt", "macros", "time"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true

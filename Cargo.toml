[package]
name = "sysmqttd"
version = "0.1.4"
edition = "2021"

[dependencies]
sysinfo = { version = "0.30", default-features = false }
rumqttc = { version = "0.24", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1.35", default-features = false, features = ["rt", "macros", "time", "sync"] }


[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true

# Profile for CI/CD builds (inherits from dev)
[profile.ci]
inherits = "dev"
incremental = false # Disable incremental compilation for CI
debug = 0 # No debug info needed for basic CI checks

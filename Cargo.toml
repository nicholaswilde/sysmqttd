[package]
name = "sysmqttd"
version = "0.1.19"
edition = "2021"
description = "Lightweight MQTT system telemetry daemon for single-board computers"
authors = ["Nicholas Wilde <https://github.com/nicholaswilde/>"]
license = "Apache-2.0"


[dependencies]
sysinfo = { version = "0.30", default-features = false }
rumqttc = { version = "0.24", default-features = false, features = ["use-rustls"] }
tokio-rustls = "0.25"
rustls-pemfile = "2.0"
rustls-native-certs = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1.35", default-features = false, features = ["rt", "macros", "time", "sync"] }

[dev-dependencies]
testcontainers = "0.23"


[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true

# Profile for CI/CD builds (inherits from dev)
[profile.ci]
inherits = "dev"
incremental = false # Disable incremental compilation for CI
debug = 0 # No debug info needed for basic CI checks

[package.metadata.deb]
maintainer = "Nicholas Wilde <https://github.com/nicholaswilde/>"
section = "utils"
depends = "sudo, systemd"
maintainer-scripts = "deployment"
assets = [
    ["target/release/sysmqttd", "usr/bin/sysmqttd", "755"],
    ["sysmqttd.toml.example", "etc/sysmqttd/sysmqttd.toml.example", "644"],
    ["deployment/sysmqttd.service.template", "usr/share/sysmqttd/sysmqttd.service.template", "644"],
    ["deployment/sysmqttd.sudoers.template", "usr/share/sysmqttd/sysmqttd.sudoers.template", "644"]
]


[package.metadata.generate-rpm]
group = "Applications/System"
release = "1"
post_install_script = "deployment/post_install.sh"
pre_uninstall_script = "deployment/pre_uninstall.sh"

[package.metadata.generate-rpm.requires]
sudo = "*"
systemd = "*"

[[package.metadata.generate-rpm.assets]]
source = "target/release/sysmqttd"
dest = "/usr/bin/sysmqttd"
mode = "0755"

[[package.metadata.generate-rpm.assets]]
source = "sysmqttd.toml.example"
dest = "/etc/sysmqttd/sysmqttd.toml.example"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "deployment/sysmqttd.service.template"
dest = "/usr/share/sysmqttd/sysmqttd.service.template"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "deployment/sysmqttd.sudoers.template"
dest = "/usr/share/sysmqttd/sysmqttd.sudoers.template"
mode = "0644"

